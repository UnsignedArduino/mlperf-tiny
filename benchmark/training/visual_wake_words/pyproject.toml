[project]
name = "visual-wake-words"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Cyrus Yiu", email = "UnsignedArduino@outlook.com" }
]
requires-python = ">=3.8, <3.9"
dependencies = [
    "absl-py>=0.15.0",
    "numpy>=1.19.5",
    "pillow>=10.4.0",
    "protobuf<3.20",
    "scipy>=1.10.1",
    "tensorflow==2.6.*",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
