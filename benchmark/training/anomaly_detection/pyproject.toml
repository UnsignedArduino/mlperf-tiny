[project]
name = "anomaly-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Cyrus Yiu", email = "UnsignedArduino@outlook.com" }
]
requires-python = ">=3.8, <3.9"
dependencies = [
    "audioread>=2.1.5",
    "librosa>=0.6.0",
    "matplotlib>=3.2.0",
    "numba>=0.48.0",
    "numpy>=1.16.0",
    "pyyaml>=5.1",
    "scikit-learn>=0.22",
    "setuptools>=41.0.0",
    "tensorflow>=2.3.0",
    "tqdm>=4.23.4",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
